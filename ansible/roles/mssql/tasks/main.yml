# - name: check install already done
#   win_stat:
#     path: "C:\\Program Files\\Microsoft SQL Server\\MSSQL15.{{sql_instance_name}}"
#   register: mssql_install_already_done

- name: check MSSQL service already exist (if failed service do not exist, launch install)
  win_service:
    name: '{{mssql_service_name}}'
  register: mssql_install_already_done
  failed_when: mssql_install_already_done is not defined
  ignore_errors: yes

- debug: msg="{{mssql_install_already_done}}"

# Install the database with a domain admin user
# NOTE: this used to run inline via win_command with become(runas, netonly). That hangs the WinRM
# shell forever with no timeout once the installer runs more than a few seconds - see
# https://github.com/ansible/ansible/issues/72991. Launching it detached via Start-Process under
# become(runas) doesn't work either: without -NoNewWindow the process can't allocate a console in
# the non-interactive session and dies instantly with no output, and with -NoNewWindow it shares
# the become session's job object so the WinRM exec still blocks until it exits.
# Running it via a Scheduled Task with a real password logon avoids all of this: it gets a normal
# session (so the console works) that isn't tied to the WinRM/become exec, and a real network logon
# for the domain admin account (so it doesn't need the netonly double-hop trick either).
- name: Remove any leftover database installer scheduled task
  community.windows.win_scheduled_task:
    name: SengoadMssqlInstall
    state: absent
  when: mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

- name: Create the database installer scheduled task
  community.windows.win_scheduled_task:
    name: SengoadMssqlInstall
    state: present
    enabled: yes
    username: "{{domain_admin}}"
    password: "{{domain_admin_password}}"
    logon_type: password
    run_level: highest
    actions:
      - path: c:\setup\mssql\sql_installer.exe
        arguments: /configurationfile=c:\setup\mssql\sql_conf.ini /IACCEPTSQLSERVERLICENSETERMS /MEDIAPATH=c:\setup\mssql\media /QUIET /HIDEPROGRESSBAR
        working_directory: c:\setup
  when: mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

- name: Start the database installer scheduled task
  win_shell: Start-ScheduledTask -TaskName SengoadMssqlInstall
  when: mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

- name: Wait for the database installer to finish
  win_shell: "(Get-ScheduledTask -TaskName SengoadMssqlInstall).State.ToString()"
  register: mssqlinstall_wait
  until: (mssqlinstall_wait.stdout | trim) != "Running"
  retries: 60
  delay: 60
  when: mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

- name: Remove the database installer scheduled task
  community.windows.win_scheduled_task:
    name: SengoadMssqlInstall
    state: absent
  when: mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

- name: Verify the database service was created
  win_service:
    name: '{{mssql_service_name}}'
  register: mssqlinstall_result
  when: mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

- name: Show the installer output if the service was not created
  win_shell: |
    $summary = Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter 'Summary.txt' -ErrorAction SilentlyContinue |
      Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
    if ($summary) { Get-Content $summary } else { "no Summary.txt found under Microsoft SQL Server - setup.exe likely never ran" }
  register: mssqlinstall_log
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - mssqlinstall_result.exists is not defined or not mssqlinstall_result.exists

- name: Fail with the installer output
  fail:
    msg: "{{ mssqlinstall_log.stdout_lines | default(['no installer output captured']) }}"
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - mssqlinstall_result.exists is not defined or not mssqlinstall_result.exists

# sql server 2022
- name: Add or update registry for ip port
  win_regedit:
    path: 'HKLM:\Software\Microsoft\Microsoft SQL Server\MSSQL16.{{ sql_instance_name }}\MSSQLServer\SuperSocketNetLib\Tcp\IPAll'
    name: TcpPort
    data: 1433
  register: win_reg
  when: sql_version == "MSSQL_2022"

# sql server 2019
- name: Add or update registry for ip port
  win_regedit:
    path: 'HKLM:\Software\Microsoft\Microsoft SQL Server\MSSQL15.{{ sql_instance_name }}\MSSQLServer\SuperSocketNetLib\Tcp\IPAll'
    name: TcpPort
    data: 1433
  register: win_reg
  when: sql_version == "MSSQL_2019"

- name: Reboot
  win_reboot:
  when: win_reg.changed

- name: Firewall | Allow MSSQL through Firewall
  win_dsc:
    resource_name: xFirewall
    Name: "Access for MSSQL (TCP-In)"
    Ensure: present
    Enabled: True
    Profile: "Domain"
    Direction: "Inbound"
    Localport: "1433"
    Protocol: "TCP"
    Description: "Opens the listener port for MSSQL"

- name: Firewall | Allow MSSQL discover through Firewall
  win_dsc:
    resource_name: xFirewall
    Name: "Access for MSSQL (UDP-In)"
    Ensure: present
    Enabled: True
    Profile: "Domain"
    Direction: "Inbound"
    Localport: "1434"
    Protocol: "UDP"
    Description: "Opens the discover port for MSSQL"

- name: Be sure service is started
  win_service:
    name: '{{mssql_service_name}}'
    force_dependent_services: yes
    state: started

- name: Wait for port 1433 to become open on the host, start checking every 5 seconds
  ansible.windows.win_wait_for:
    port: 1433
    delay: 5

- name: Add MSSQL admin
  win_shell: |
    SqlCmd {{connection_type}} -Q "CREATE LOGIN [{{item}}] FROM WINDOWS"
    SqlCmd {{connection_type}} -Q "SP_ADDSRVROLEMEMBER '{{item}}','SYSADMIN'"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  loop: "{{sql_sysadmins}}"

- name: Add IMPERSONATE on login
  win_shell: |
    SqlCmd {{connection_type}} -Q "CREATE LOGIN [{{item.key}}] FROM WINDOWS"
    SqlCmd {{connection_type}} -Q "GRANT IMPERSONATE ON LOGIN::[{{item.value}}] TO [{{item.key}}]"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  with_dict: "{{executeaslogin}}"

- name: Add IMPERSONATE on user
  win_shell: |
    SqlCmd {{connection_type}} -Q "CREATE LOGIN [{{item.key}}] FROM WINDOWS"
    SqlCmd {{connection_type}} -Q "USE {{item.value.db}};CREATE USER [{{item.value.user}}] FOR LOGIN [{{item.value.user}}]"
    SqlCmd {{connection_type}} -Q "USE {{item.value.db}};GRANT IMPERSONATE ON USER::[{{item.value.impersonate}}] TO [{{item.value.user}}]"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  with_dict: "{{executeasuser}}"

- name: Enable sa account
  win_shell: |
    SqlCmd {{connection_type}} -Q "ALTER LOGIN sa ENABLE"
    SqlCmd {{connection_type}} -Q "ALTER LOGIN sa WITH PASSWORD = '{{sa_password}}' , CHECK_POLICY=OFF"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"

- name: enable MSSQL authentication and windows authent
  win_shell: |
    SqlCmd {{connection_type}} -Q "EXEC xp_instance_regwrite N'HKEY_LOCAL_MACHINE', N'Software\Microsoft\MSSQLServer\MSSQLServer', N'LoginMode', REG_DWORD, 2"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"

- name: Restart service MSSQL
  win_service:
    name: '{{mssql_service_name}}'
    force_dependent_services: yes
    state: restarted
