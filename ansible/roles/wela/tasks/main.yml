---
# All Windows audit configuration is delegated to WELA (Yamato-Security/WELA) so there is a single,
# maintained source of truth instead of hand-maintained auditpol / registry / wevtutil commands here.
#   - configure      : audit policy (all detection subcategories), event-log sizes, PowerShell script-block
#                      + module logging, command-line-in-process-creation, NTLM auditing, and - on domain
#                      controllers - LDAP query logging (Directory Service 1644).
#   - configure-sacl : enables the File System / Registry / Handle Manipulation subcategories and applies
#                      TARGETED audit SACLs on the autostart/persistence registry keys and sensitive files
#                      the Hayabusa/Sigma rules watch (machine-wide + per-user across all profiles), without
#                      global object auditing.
# Requires a WELA build that includes the 'configure-sacl' command (Yamato-Security/WELA#361).

- name: Create WELA directory
  ansible.windows.win_file:
    path: C:\Tools\WELA
    state: directory

- name: Download WELA
  ansible.windows.win_get_url:
    url: https://github.com/Yamato-Security/WELA/archive/refs/heads/main.zip
    dest: C:\Tools\WELA\WELA.zip

- name: Extract WELA
  community.windows.win_unzip:
    src: C:\Tools\WELA\WELA.zip
    dest: C:\Tools\WELA
    delete_archive: no

- name: Configure audit policy, log sizes and logging via WELA
  ansible.windows.win_command: powershell.exe -ExecutionPolicy Bypass -File C:\Tools\WELA\WELA-main\WELA.ps1 configure -Auto

- name: Apply targeted File System / Registry audit SACLs via WELA
  ansible.windows.win_command: powershell.exe -ExecutionPolicy Bypass -File C:\Tools\WELA\WELA-main\WELA.ps1 configure-sacl -Auto
